<style>

/* inicio, técnica, asistente, rutinas */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.zone{border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-lg);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.zone:hover{border-color:var(--line)}
.zone .tf{background:var(--raised);border-radius:var(--r-md);height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden}
.zone .tf svg{height:100%;width:auto;max-width:100%}
.zone b{font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;padding:0 4px;overflow-wrap:anywhere}.zone small{color:var(--muted);font-size:12px;padding:0 4px}
.h2{margin:22px 0 10px;font-family:'Big Shoulders Display',sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.hero p{margin:4px 0 12px}.hero h3{margin:0}
.tec{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}
.tec svg.fig{width:200px;max-width:100%;height:auto;background:var(--raised);border-radius:var(--r-md);flex:none}
.tec-b{flex:1;min-width:200px}.tec-b ol,.tec2 ul{margin:4px 0 0;padding-left:20px}.tec-b li,.tec2 li{margin:3px 0}
.tec2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.tec2>div{background:var(--raised);border-radius:var(--r-md);padding:10px 12px}
.tec2 .safe{border-left:4px solid var(--red)}
.fig-cap{font-size:11.5px;color:var(--muted);margin:4px 0 0;width:200px;max-width:100%}
.wz .gl{margin-top:12px}
.rtc h3{margin:0 0 2px}.rtc .by{color:var(--muted);font-size:13px}
.rtc ul{margin:6px 0;padding-left:18px}
.glos dt{font-weight:700;margin-top:8px}.glos dd{margin:2px 0 0;color:var(--muted)}
.newsc{border-left:4px solid #D32F2F}.newsh{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}.newsr{display:flex;gap:10px;align-items:center;padding:6px 0;border-top:1px solid var(--line)}.newst{font-size:14px;line-height:1.35;min-width:0;overflow-wrap:anywhere}.newst small{display:block;color:var(--mut,#777);font-size:12px}.fdel{margin-left:auto}.pers{margin-bottom:12px}.pers b{display:block}.pv small{font-size:12px;color:var(--muted)}.onb-top{display:flex;align-items:center;gap:10px;margin:6px 0 4px}.onb-n{font:700 12px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.onb-bar{flex:1;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.onb-bar i{display:block;height:100%;background:var(--ink,#111);border-radius:3px}
.onb-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.onb-act .big{flex:1;min-width:150px}
.paths{display:grid;gap:12px}.pathc{text-align:left;border:2px solid var(--line);background:var(--surface,#fff);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit;cursor:pointer;position:relative}.pathc b{font-size:18px}.pathc span{color:var(--muted);font-size:14px;line-height:1.35}.pathc em{position:absolute;top:12px;right:12px;font-style:normal;font-size:11px;font-weight:700;background:var(--ink,#111);color:var(--surface,#fff);padding:3px 8px;border-radius:10px}
.tut{text-align:left}.tut-ic{width:60px;height:60px;border-radius:18px;background:var(--line);display:flex;align-items:center;justify-content:center;margin-bottom:10px}.tut-t{margin:0 0 8px}.tut-l{margin:0;padding-left:20px;display:grid;gap:8px;line-height:1.4}.dots{display:flex;gap:6px;justify-content:center;margin-top:16px}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--ink,#111);width:20px;border-radius:4px}
.tab{position:relative}.bdg{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:#D32F2F;color:#fff;font:700 11px/18px system-ui,sans-serif;font-style:normal;text-align:center;box-shadow:0 0 0 2px var(--bg)}.soc-dot{display:inline-block;min-width:18px;height:18px;border-radius:9px;background:#D32F2F;color:#fff;font:700 11px/18px system-ui,sans-serif;text-align:center;margin-left:6px;padding:0 5px}
.invite b{font-size:17px}.srch{position:relative}.srch input{width:100%;height:48px;border:1.5px solid transparent;background:var(--surface);border-radius:999px;padding:0 16px 0 44px}.sico{position:absolute;left:15px;top:50%;transform:translateY(-50%);color:var(--muted);display:flex;pointer-events:none}.sres{margin-top:8px}.frst{font-size:13px;font-weight:700;color:var(--muted);display:inline-flex;align-items:center;gap:4px;white-space:nowrap}.frst.ok{color:var(--green)}.fr .btn.sm{min-height:40px;padding:0 16px;border-radius:999px;white-space:nowrap}
/* iOS hace zoom y desplaza la página si un campo tiene menos de 16px */
input,select,textarea{font-size:16px!important}textarea{font-family:inherit;line-height:1.35}
</style>
<style>
/* Concepto: cuaderno de gimnasio moderno. Superficies blancas redondeadas sobre fondo frío,
   nav flotante de cristal y un color por sesión tomado de los discos olímpicos:
   piernas = rojo (25 kg), push = azul (20 kg), pull = verde (10 kg). */
:root{
  --font-display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#E8ECEF; --surface:#FFFFFF; --raised:#F0F3F5; --ink:#12181D; --muted:#56616A;
  --line:#D3DADF; --line-soft:#E3E8EB;
  --red:#C23229; --blue:#1B58C4; --green:#237A41; --gold:#A6720A; --on-color:#FFFFFF;
  --sh:0 1px 2px rgba(15,23,32,.05),0 12px 30px -16px rgba(15,23,32,.30);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sc:var(--blue);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1013; --surface:#151A1F; --raised:#1E242A; --ink:#E7ECEF; --muted:#8E9AA3;
    --line:#2B333A; --line-soft:#222930;
    --red:#EE6D63; --blue:#6E9EF4; --green:#5EC282; --gold:#E7B84C; --on-color:#0E1215;
    --sh:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1013; --surface:#151A1F; --raised:#1E242A; --ink:#E7ECEF; --muted:#8E9AA3;
  --line:#2B333A; --line-soft:#222930;
  --red:#EE6D63; --blue:#6E9EF4; --green:#5EC282; --gold:#E7B84C; --on-color:#0E1215;
  --sh:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  --tint:var(--blue);
  background-color:var(--bg);
  background-image:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--tint) 16%,transparent),transparent 70%);
  background-repeat:no-repeat;background-size:100% 460px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-block:14px 190px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.t-piernas{--tint:var(--red)} body.t-push{--tint:var(--blue)} body.t-pull{--tint:var(--green)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
.k-piernas{--sc:var(--red)} .k-push{--sc:var(--blue)} .k-pull{--sc:var(--green)}
.stage-1{--sc:var(--blue)} .stage-2{--sc:var(--red)} .stage-3{--sc:var(--green)}

/* cabecera */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 16px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.plate{width:24px;height:24px;border-radius:50%;background:var(--sc);flex:none;
  -webkit-mask:radial-gradient(circle at center,transparent 0 27%,#000 28%);mask:radial-gradient(circle at center,transparent 0 27%,#000 28%)}
.outb{font:inherit;font-weight:700;color:var(--ink);background:none;border:0;padding:0;cursor:pointer}
.status{font-size:12px;color:var(--muted);text-align:right;min-width:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px;white-space:nowrap;flex:none}
.pagehead{margin:4px 0 16px}
.pagehead.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0 0 2px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:46px;line-height:.95;letter-spacing:.012em;text-transform:uppercase;text-wrap:balance}
h2{margin:24px 0 10px;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase}
h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ring{flex:none}
.ring-t{font-family:var(--font-num);font-size:15px;font-weight:600;fill:var(--ink)}
.toolrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.week-t{font-size:13px;color:var(--muted)}
.week-t b{font-family:var(--font-num);color:var(--ink);font-size:16px}

/* botones */
.btn{border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-md);padding:10px 16px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sc{background:var(--sc);color:var(--on-color);border-color:var(--sc)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13px;border-radius:99px;box-shadow:none;border-color:var(--line)}
.btn.sm.primary,.btn.sm.sc{box-shadow:none}
.btn.armed{background:var(--red);color:var(--on-color);border-color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.ico:hover{background:var(--raised);color:var(--ink)}
.ico.armed{background:var(--red);color:var(--on-color);width:auto;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600}
.ic{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}

/* selector de sesión */
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.chip{border:0;background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-radius:20px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:96px;box-shadow:var(--sh)}
.chip .plate{width:30px;height:30px}
.chip .tk{color:var(--sc)}
.chip .nm{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.02;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto}
.chip .sub{font-size:11.5px;color:var(--muted);min-height:15px;font-weight:600}
.chip .top{display:flex;align-items:center;justify-content:space-between}
.chip.on{background:var(--sc);color:var(--on-color)}
.chip.on .plate{background:var(--on-color)}
.chip.on .tk,.chip.on .sub{color:var(--on-color)}
.chip.on .sub{opacity:.85}

/* entrenamiento */
.meta{font-size:13px;color:var(--muted)}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.rchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:3px 11px 3px 8px;font-size:12.5px;font-weight:600;font-family:var(--font-num)}
.rchip:hover{border-color:var(--ink)}
.wh{background:linear-gradient(140deg,var(--sc),color-mix(in srgb,var(--sc) 76%,var(--ink)));color:var(--on-color);border-radius:var(--r-lg);padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.wh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wh-k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.8}
.wh-n{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.wh-c{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--on-color) 20%,transparent);border-radius:99px;padding:5px 11px;font-size:14px;font-weight:600}
.wh-f{font-size:13px;opacity:.88;margin:8px 0 12px}
.wh-p{display:flex;align-items:center;gap:12px}
.wh-bar{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-color) 28%,transparent);overflow:hidden}
.wh-bar i{display:block;height:100%;background:var(--on-color);border-radius:99px;transition:width .3s}
.warm{margin-bottom:12px}
.warm h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-size:19px;margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14px}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--sc);flex:none}
.ex{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:14px 12px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;padding:0 2px}
.ex-h .nm{min-width:0}
.note{font-size:13px;background:var(--raised);border-radius:var(--r-sm);padding:8px 11px;margin:0 0 10px;color:var(--muted)}
.sh,.set{display:grid;grid-template-columns:36px minmax(0,1fr) 74px 70px 50px;gap:6px;align-items:center}
.pv{font-size:13px;color:var(--muted);text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-variant-numeric:tabular-nums}
.sw-top{position:sticky;top:0;z-index:15;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:calc(8px + env(safe-area-inset-top,0px)) 0 8px;margin:-2px 0 6px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px)}
.sw-ic{width:48px;height:44px;border:0;border-radius:12px;background:var(--raised);display:flex;align-items:center;justify-content:center;color:var(--ink)}
.sw-el{font-size:17px;color:var(--muted);font-weight:600}
.cancel-tr{display:block;width:100%;margin-top:14px;min-height:44px;border:0;border-radius:12px;background:transparent;color:var(--red);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}.cancel-tr.armed{background:#C62828;color:#fff;text-decoration:none;font-weight:700;outline:3px solid #ff9a9a}
.gbig{display:flex;align-items:center;justify-content:center;gap:12px;width:100%;min-height:58px;border-radius:14px;border:2px solid #dadce0;background:#fff;color:#1f1f1f;font-weight:700;font-size:17px;box-shadow:0 2px 8px rgba(0,0,0,.18);cursor:pointer}.gbig:active{transform:scale(.98)}
.gor{display:flex;align-items:center;gap:10px;margin:16px 0 12px;color:var(--muted,#8a94a3);font-size:13px}.gor:before,.gor:after{content:'';flex:1;height:1px;background:currentColor;opacity:.3}
.sw-fin{min-height:44px;padding:0 22px;border:0;border-radius:12px;background:var(--green);color:var(--on-color);font-weight:700;font-size:16px}
.sw-title{margin:6px 0 4px;font-family:var(--font-display);font-size:34px;font-weight:800;text-transform:uppercase;line-height:1}
.sw-meta{display:flex;gap:16px;flex-wrap:wrap;margin:0 0 8px;color:var(--muted);font-size:14px}
.sw-meta b{color:var(--ink)}
.sw-bar{height:6px;border-radius:99px;background:var(--line-soft);margin-bottom:14px;overflow:hidden}
.sw-bar i{display:block;height:100%;background:var(--green);border-radius:99px;transition:width .25s}

.trow{display:flex;gap:8px;flex-wrap:wrap}
.trow .btn{flex:1;min-width:140px}
.tdef{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 14px}
.tdef strong{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.drow{display:flex;align-items:center;justify-content:space-between;padding:4px 0}
.dctl{display:flex;align-items:center;gap:4px}
.dctl .num{min-width:48px;text-align:center;font-size:16px}

/* progreso */
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-bottom:6px}
.tile{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);padding:12px 14px;box-shadow:var(--sh)}
.tile b{display:block;font-family:var(--font-num);font-size:25px;font-weight:600;line-height:1.1}
.tile span{font-size:12px;color:var(--muted)}
.chart{width:100%;height:auto;display:block;overflow:visible}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .tx{fill:var(--muted);font-family:var(--font-num);font-size:11px}
.chart .ln{fill:none;stroke:var(--sc);stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.chart .pt{fill:var(--surface);stroke:var(--sc);stroke-width:2.5}
.chart .pe{fill:var(--sc);stroke:var(--surface);stroke-width:2}
.chart .vl{fill:var(--ink);font-family:var(--font-num);font-size:12px;font-weight:600}
.dl{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px 14px;margin:10px 0 0}
.dl div{min-width:0}
.dl dt{font-size:11.5px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.dl dd{margin:1px 0 0;font-family:var(--font-num);font-size:14.5px}
.hist{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-md);margin-bottom:6px;overflow:hidden;box-shadow:var(--sh)}
.hist-h{width:100%;border:0;background:transparent;text-align:left;padding:12px 14px;display:flex;align-items:center;gap:10px}
.hist-h .nm{flex:1;min-width:0;font-weight:600}
.hist-h .dt{font-size:12.5px;color:var(--muted);font-weight:400}
.hist-d{padding:0 14px 14px;font-size:13.5px}
.hist-d h4{margin:8px 0 2px;font-size:13.5px}
.hist-d .sl{font-family:var(--font-num);font-size:12.5px;color:var(--muted)}

/* metas */
.prio{background:transparent;color:var(--muted);border:1px solid var(--line);border-radius:var(--r-md);padding:10px 14px;margin-bottom:10px;font-size:13.5px}
.prio b{color:var(--ink);font-weight:700}
.stg-h{display:flex;align-items:center;gap:10px;margin:24px 0 8px}
.stg-h .plate{width:28px;height:28px}
.stg-h h2{margin:0}
.goal{padding:12px 0;border-top:1px solid var(--line-soft)}
.goal:first-of-type{border-top:0}
.goal-t{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;font-weight:600}
.goal-v{font-size:13px;color:var(--muted);margin:3px 0 8px}
.pbar{height:10px;border-radius:99px;background:var(--raised);overflow:hidden}
.pbar i{display:block;height:100%;background:var(--sc);border-radius:99px}
.ok{font-size:11px;letter-spacing:.07em;text-transform:uppercase;font-weight:700;color:var(--gold);border:1px solid var(--gold);border-radius:99px;padding:2px 9px;white-space:nowrap}
.tg{width:28px;height:28px;border:1.5px solid var(--line);border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;color:transparent;flex:none}
.tg.on{background:var(--sc);border-color:var(--sc);color:var(--on-color)}
.brow{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line-soft);font-size:14px}
.brow .num{flex:1}
.empty{text-align:center;color:var(--muted);padding:24px 14px}.card.empty{border:1.5px dashed var(--line);background:transparent}
@media (max-width:400px){
  h1{font-size:38px}
  .sh,.set{grid-template-columns:32px minmax(0,1fr) 68px 62px 46px;gap:5px}
  .ck{width:44px;height:44px}
  .chip .nm{font-size:20px}
  .wh-n{font-size:32px}
  .tdisp{font-size:56px}
}
@media (prefers-reduced-motion:no-preference){
  .set,.ck,.chip,.btn,.tab,.gc{transition:background-color .18s,border-color .18s,color .18s,transform .18s}
  .btn:active,.chip:active,.ck:active{transform:scale(.97)}
  @keyframes pop{0%{transform:scale(.6)}60%{transform:scale(1.18)}100%{transform:scale(1)}}
  .set.done .ck svg{animation:pop .3s ease-out}
}

/* planes, metas editables y evidencia */
.pchips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 12px}
.pchips .gc{white-space:normal;text-align:left}
.gc.add{border-style:dashed}
.gen h3,.gform h3{margin:0 0 6px}
.gl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px}
.pinfo{margin-bottom:12px}
.pi-n{font-family:var(--font-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.prow-b{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.toolbar2{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.gctl{display:flex;gap:8px;margin-top:8px}
.stin{flex:1;min-width:0;height:40px;border:1.5px solid transparent;background:var(--surface);border-radius:var(--r-md);padding:0 12px;font-size:15px;box-shadow:var(--sh)}
.stin:focus{outline:0;border-color:var(--ink)}
.gform{margin-bottom:12px}
.evl{list-style:none;padding:0;margin:10px 0 0}
.evl li{padding:12px 0;border-top:1px solid var(--line-soft)}
.evl li:first-child{border-top:0}
.ev-h{display:flex;gap:8px;justify-content:space-between;align-items:flex-start}
.ev-x{margin:6px 0 0;font-size:14px;color:var(--ink)}
.ev-d{margin:6px 0 0;font-size:13.5px;color:var(--muted)}
.ev-s{margin:6px 0 0;font-size:12.5px;color:var(--muted);overflow-wrap:anywhere}
.ev-s a{color:inherit;text-decoration:underline}
.evt{flex:none;font-size:11px;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--raised);color:var(--muted);white-space:nowrap}
.evt.s{background:color-mix(in srgb,var(--green) 22%,var(--surface));color:var(--ink)}
.evt.m{background:color-mix(in srgb,var(--blue) 18%,var(--surface));color:var(--ink)}
.evt.l{background:color-mix(in srgb,var(--red) 16%,var(--surface));color:var(--ink)}
.an{margin-top:10px}
.an-r{display:grid;grid-template-columns:84px minmax(0,1fr) 54px auto;gap:8px;align-items:center;padding:5px 0;font-size:13.5px}
.an-n{font-weight:600}
.an-v{text-align:right;font-size:12.5px;color:var(--muted)}
.vbar{height:9px;border-radius:99px;overflow:hidden;background:linear-gradient(90deg,transparent 41.6%,color-mix(in srgb,var(--green) 24%,transparent) 41.6% 83.3%,transparent 83.3%),var(--raised)}
.vbar i{display:block;height:100%;background:var(--ink);border-radius:99px}
@media (max-width:420px){.an-r{grid-template-columns:70px minmax(0,1fr) 48px}.an-r .evt{display:none}}
</style>
</head>

/* anti-trampa: una sesión solo se comparte si es creíble. Devuelve '' si vale, o el motivo. */
function shareCheck(s){
  if(!s||s.dur==null)return '';

  if(s.dur<MIN_SHARE)return 'dura menos de '+MIN_SHARE+' minutos';

  if(n/s.dur>1.5)return 'el ritmo de series no es realista';

}
function sSets(d){if(d.nsets!=null)return d.nsets;var n=0;(d.items||[]).forEach(function(it){(it.sets||[]).forEach(function(x){if(!x.w)n++;});});return n;}
function topLifts(d){
  var out=[];
  (d.items||[]).forEach(function(it){
    var ex=exOf(it.id),best=null,bv=-1;if(isCardio(ex))return;
    (it.sets||[]).forEach(function(s){if(s.w)return;var v=isBW(ex)?((s.kg||0)*1000+s.reps):epley(s.kg,s.reps);if(v>bv){bv=v;best=s;}});
    if(best)out.push({name:ex.name,txt:fmtSet(ex,best),v:bv,w:isBW(ex)?(best.kg||0)*1000+best.reps:best.kg*best.reps});
  });
  return out.sort(function(a,b){return b.w-a.w;}).slice(0,3);
}

async function fetchNews(){
  if(S.mode!=='db'||!me||!S.soc)return false;
  var soc=S.soc,out=[];
  try{
    var q=await Promise.all([
      sb.from('kudos').select('session_id,user_id,created_at').eq('owner_id',me.id).neq('user_id',me.id).order('created_at',{ascending:false}).limit(60),
      sb.from('comments').select('id,session_id,user_id,body,created_at').eq('owner_id',me.id).neq('user_id',me.id).order('created_at',{ascending:false}).limit(60)
    ]);

    q[0].data.forEach(function(k){out.push({t:'k',u:k.user_id,s:k.session_id,at:k.created_at,k:'k'+k.session_id+k.user_id});});
    q[1].data.forEach(function(c){out.push({t:'c',u:c.user_id,s:c.session_id,at:c.created_at,txt:c.body,k:'c'+c.id});});

function splitSets(total,w){
  var k=Math.min(w.length,3,Math.max(1,Math.floor(total/2))),out,add=function(a,b){return a+b;};
  for(;;){
    var ww=w.slice(0,k),sum=ww.reduce(add,0),raw=ww.map(function(x){return total*x/sum;});
    out=raw.map(Math.floor);
    var rem=total-out.reduce(add,0);
    var order=raw.map(function(r,i){return [r-Math.floor(r),i];}).sort(function(a,b){return b[0]-a[0]||a[1]-b[1];});
    for(var i=0;rem>0;i++,rem--)out[order[i%k][1]]++;
    if(k>1&&Math.min.apply(null,out)<2){k--;continue;}
    break;
  }
  return out.map(function(v){return Math.max(1,Math.min(5,v));});

/* búsqueda de ejercicios: sin tildes ni mayúsculas y tolerante a erratas */
function fold(s){return String(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');}
function lev(a,b,max){if(Math.abs(a.length-b.length)>max)return max+1;var p=[],i,j;for(j=0;j<=b.length;j++)p[j]=j;for(i=1;i<=a.length;i++){var c=[i],m=i;for(j=1;j<=b.length;j++){c[j]=Math.min(p[j]+1,c[j-1]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));if(c[j]<m)m=c[j];}if(m>max)return max+1;p=c;}return p[b.length];}
function exHit(e,q){
  var hay=fold(e.name+' '+e.grp+' '+e.eq+' '+(e.sec||'')+' '+(e.alias||'')),words=null;
  return q.split(/\s+/).every(function(w){
    if(hay.indexOf(w)>=0)return true;
    if(w.length<4)return false;
    if(!words)words=hay.split(/[^a-z0-9ñ]+/).filter(Boolean);
    var tol=w.length>=8?2:1;
    return words.some(function(x){return x.length>=3&&(lev(w,x,tol)<=tol||(x.length>w.length&&lev(w,x.slice(0,w.length),tol)<=tol));});
  });
}
function matchEx(e){
  var q=fold(S.q.trim());
  if(!inGrp(e.grp,S.grp))return false;
  if(S.eq!=='Todos'&&e.eq!==S.eq)return false;
  if(q)return exHit(e,q);
  return true;
}
function exListHTML(){
  var list=Array.from(EX.values()).filter(matchEx);

  var order=GROUPS.concat(['Otros']);
  list.sort(function(a,b){var ga=order.indexOf(a.grp),gb=order.indexOf(b.grp);ga=ga<0?99:ga;gb=gb<0?99:gb;return ga-gb||a.name.localeCompare(b.name,'es');});

function niceStep(x){if(!(x>0))return 1;var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function chartSVG(pts){
  var W=640,H=240,L=50,R=26,T=22,B=32,n=pts.length;
  var min=Math.min.apply(null,pts.map(function(p){return p.v;})),max=Math.max.apply(null,pts.map(function(p){return p.v;}));
  if(min===max){min=Math.max(0,min-5);max=max+5;}
  var step=niceStep((max-min)/4),y0=Math.floor(min/step)*step,y1=Math.ceil(max/step)*step;if(y0===y1)y1=y0+step;
  var X=function(i){return n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1);},Y=function(v){return T+(H-T-B)*(1-(v-y0)/(y1-y0));};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del ejercicio">';
  for(var v=y0;v<=y1+1e-9;v+=step){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="tx" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>';}
  if(n>1)s+='<path class="ln" d="'+pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    var last=i===n-1,cx=X(i).toFixed(1),cy=Y(p.v).toFixed(1);
    s+='<circle class="'+(last?'pe':'pt')+'" cx="'+cx+'" cy="'+cy+'" r="'+(last?6:4)+'"/>';
    if(last)s+='<text class="vl" x="'+cx+'" y="'+(Y(p.v)-12).toFixed(1)+'" text-anchor="'+(n>1?'end':'middle')+'">'+fmt(p.v)+'</text>';
  });
  var idx=n===1?[0]:n===2?[0,1]:[0,Math.floor((n-1)/2),n-1];
  idx.forEach(function(i){s+='<text class="tx" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(n===1?'middle':i===0?'start':i===n-1?'end':'middle')+'">'+esc(dateShort(pts[i].d))+'</text>';});
  return s+'</svg>';
}

/* ---------- cambiar un ejercicio por otro parecido ---------- */
var CARE_RX={back:/peso muerto|buenos d[ií]as|remo con barra|remo pendlay|hiperext|lumbar|rack pull|sentadilla con barra|press militar/i,knees:/zancada|step|b[uú]lgara|salto|sissy|pistol|sentadilla (frontal|hack)|hack/i,shoulders:/press militar|fondos|aperturas|elevaci[oó]n lateral|elevaci[oó]n frontal|press tras nuca|arnold|dominadas|muscle/i};
function swapCands(cur,sw,taken){
  var m=muscleOf(cur)||cur.grp,av=window.CF_ASIS&&CF_ASIS.AVOID||{};
  var out=[];
  EX.forEach(function(e){
    if(e.id===cur.id||taken.indexOf(e.id)>=0)return;
    if((muscleOf(e)||e.grp)!==m)return;
    if(sw.eq&&e.eq!==sw.eq)return;
    var bad=false;['back','knees','shoulders'].forEach(function(k){if(sw.care[k]&&((av[k]||[]).indexOf(e.id)>=0||CARE_RX[k].test(e.name)))bad=true;});
    if(bad)return;
    var sc=0;if(e.t===cur.t)sc+=2;if(e.eq!==cur.eq)sc+=1;if(e.eq==='Máquina'||e.eq==='Mancuerna')sc+=1;
    out.push({e:e,sc:sc});
  });
  out.sort(function(a,b){return b.sc-a.sc||a.e.name.localeCompare(b.e.name,'es');});
  return out.slice(0,8).map(function(x){return x.e;});
}

var AQZ=[['knees','Rodilla'],['back','Espalda baja'],['shoulders','Hombro'],['other','Otra zona']],AQL=[['l','Leve'],['m','Me duele al moverla'],['f','Fuerte o punzante']];

function subsFor(cur,zone,taken){var care={back:false,knees:false,shoulders:false};if(care.hasOwnProperty(zone))care[zone]=true;return swapCands(cur,{eq:'',care:care},taken).filter(function(e){return !(AQX[zone]&&AQX[zone].test(e.name));});}

async function finish(){
  var d=S.draft;if(!d)return;
  var items=[],nsets=0,vol=0,prs=[];
  d.items.forEach(function(it){
    var sets=it.sets.filter(function(s){return s.done;}).map(function(s){return {kg:num(s.kg)||0,reps:Math.round(num(s.reps)||0),w:!!s.w};}).filter(function(s){return s.reps>0;});
    if(!sets.length)return;
    items.push(it.sn&&it.sn.trim()?{id:it.id,sets:sets,n:it.sn.trim().slice(0,300)}:{id:it.id,sets:sets});
    var ex=exOf(it.id);
    if(isCardio(ex))return;
    sets.forEach(function(s){if(!s.w){nsets++;vol+=s.kg*s.reps;}});
    var work=sets.filter(function(s){return !s.w;});
    if(isBW(ex)){var pk=0;histFor(it.id).forEach(function(h){h.sets.forEach(function(s){pk=Math.max(pk,s.kg||0);});});var ck=Math.max.apply(null,work.map(function(s){return s.kg;}).concat([0]));if(pk>0&&ck>pk)prs.push(ex.name);}
    else{var prev=bestE1(it.id),cur=Math.max.apply(null,work.map(function(s){return epley(s.kg,s.reps);}).concat([0]));if(prev>0&&cur>prev+0.01)prs.push(ex.name);}
  });
  if(!items.length){toast('Marca al menos una serie como hecha.');return;}
  await initP;
  var now=new Date(),dur=d.startedAt?Math.max(1,Math.round((Date.now()-d.startedAt)/60000)):null;
  var s={id:'s'+now.toISOString().replace(/\D/g,''),date:now.toISOString(),key:d.key,name:d.name,kind:d.kind,dur:dur,items:items,nsets:nsets,vol:Math.round(vol),prs:prs};
  var prevS=S.sessions.find(function(x){return x.key===d.key;}),prevVol=prevS?sessionVol(prevS):0;
  var why=shareCheck(s),noShare=!!why&&S.mode==='db'&&S.cfg.share!==false;if(why)s.shared=false;
  var queued=false;
  try{await saveSession(s);}catch(e){
    if(S.mode==='db'&&(!navigator.onLine||/fetch|network|load failed/i.test(String(e&&e.message||e)))){queueSession(s);queued=true;}
    else{toast('No se pudo guardar la sesión. Se conserva tu borrador.');return;}
  }
  S.draft=null;S.min=false;S.tab='hoy';saveDraft();stopRest();S.summary={id:s.id,name:d.name,nsets:nsets,vol:vol,pvol:prevVol,dur:dur,prs:prs,queued:queued,note:queued?'Sin conexión: la sesión está guardada en tu móvil y se subirá sola cuando vuelva la señal.':noShare?'No se comparte con tus amigos porque '+why+'. Para compartir: mínimo '+MIN_SHARE+' min y 4 series.':''};
  render(true);window.scrollTo(0,0);
}

    (d.custom||[]).forEach(function(e){if(e&&e.id&&e.name&&!EX.has(e.id)){S.cfg.custom.push({id:String(e.id).slice(0,40),name:String(e.name).slice(0,80),grp:GROUPS.indexOf(e.grp)>=0?e.grp:'Otros',eq:EQS.indexOf(e.eq)>=0?e.eq:'Peso corporal',t:e.t==='C'?'C':'A',sec:'',cue:'',alias:'',custom:true});}});
    rebuildEx();
    var sess=(d.sessions||[]).map(function(s,i){return {key:pid+'-'+(i+1),name:String(s.name||'Sesión').slice(0,60),kind:['push','pull','piernas'].indexOf(s.kind)>=0?s.kind:'push',focus:String(s.focus||'').slice(0,120),items:(s.items||[]).filter(function(it){return it&&EX.has(it.id);}).map(function(it){return {id:it.id,sets:Math.max(1,Math.min(10,parseInt(it.sets,10)||3)),reps:String(it.reps||'').slice(0,12),last:null,note:String(it.note||'').slice(0,200)};})};}).filter(function(s){return s.items.length;});
    if(!sess.length){toast('Esta rutina no se puede copiar.');return;}
    var nm=(r.name+' (de '+pName(r.owner)+')').slice(0,80);
    dropBlank();S.cfg.plans.push({id:pid,name:nm,note:'Rutina de '+pName(r.owner)+'. '+String(r.note||'').slice(0,300),sessions:sess,created:new Date().toISOString()});
    S.cfg.activePlan=pid;S.edit=false;S.tab='plan';saveCfg();render(true);window.scrollTo(0,0);toast('Copiada a tus planes y activada.');
  },
  'g-to-plan':function(){S.tab='plan';S.gen=defaultGen();render(true);window.scrollTo(0,0);},
  'g-new':function(){S.gform={id:null,stage:String(goalStages()[0]||1),t:'e1rm',ex:goalDefEx('e1rm'),target:'',mult:'',lo:'',hi:'',label:'',newTitle:''};render(true);window.scrollTo(0,0);},
  'g-edit-mode':function(){S.goalEdit=!S.goalEdit;render(true);},
  'g-cancel':function(){S.gform=null;render(true);},
  'g-edit':function(b){
    var g=S.cfg.goalList.find(function(x){return x.id===b.dataset.id;});if(!g)return;
    var m=g.m||{};
    S.gform={id:g.id,stage:String(g.stage),t:g.manual?'manual':m.t,ex:(m.ex&&m.ex[0])||'',target:m.target||'',mult:m.mult||'',lo:m.lo||'',hi:m.hi||'',label:g.label,newTitle:''};
    render(true);window.scrollTo(0,0);
  },
  'g-del':function(b){if(!canEditCfg())return;S.cfg.goalList=S.cfg.goalList.filter(function(g){return g.id!==b.dataset.id;});saveCfg();render(true);},
  'g-save':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var f=S.gform;if(!f)return;
    var t=f.t,label=(f.label||'').trim(),m=null,manual=false,ex=f.ex?exOf(f.ex):null;
    var tg=num(f.target),mu=num(f.mult),lo=num(f.lo),hi=num(f.hi);
    if(t==='e1rm'){if(!(tg>0)||!ex){toast('Elige ejercicio y kilos objetivo.');return;}m={t:t,ex:[f.ex],target:tg};if(!label)label=ex.name+' '+fmt(tg)+' kg';}
    else if(t==='e1rmbw'){if(!(mu>0)||!ex){toast('Elige ejercicio y múltiplo.');return;}m={t:t,ex:[f.ex],mult:mu};if(!label)label=ex.name+' '+fmt(mu)+'× tu peso corporal';}
    else if(t==='maxReps'){if(!(tg>0)||!ex){toast('Elige ejercicio y repeticiones.');return;}m={t:t,ex:[f.ex],target:Math.round(tg)};if(!label)label=Math.round(tg)+' repeticiones de '+ex.name.toLowerCase();}
    else if(t==='repsLoaded'){if(!(tg>0)||!ex){toast('Elige ejercicio y repeticiones.');return;}m={t:t,ex:[f.ex],target:Math.round(tg)};if(!label)label=ex.name+' con lastre × '+Math.round(tg);}
    else if(t==='bf'){if(!(lo>0)||!(hi>=lo)){toast('Indica el rango de grasa, por ejemplo 10 y 15.');return;}m={t:t,lo:lo,hi:hi};if(!label)label='Llegar a '+fmt(lo)+'–'+fmt(hi)+' % de grasa corporal';}
    else{if(!label){toast('Escribe el nombre del hito.');return;}manual=true;}
    var stage;
    if(f.stage==='new'){stage=Math.max.apply(null,goalStages().concat([0]))+1;if((f.newTitle||'').trim())S.cfg.stageTitles[stage]=f.newTitle.trim().slice(0,50);}
    else stage=+f.stage;
    var old=f.id?S.cfg.goalList.find(function(x){return x.id===f.id;}):null;
    var goal={id:old?old.id:'g-'+Date.now().toString(36),stage:stage,label:label};
    if(manual){goal.manual=true;goal.done=old&&old.manual?!!old.done:false;}else goal.m=m;
    if(old)S.cfg.goalList[S.cfg.goalList.indexOf(old)]=goal;else S.cfg.goalList.push(goal);
    S.gform=null;saveCfg();render(true);toast('Meta guardada.');
  },
  'g-toggle':function(b){if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}var g=S.cfg.goalList.find(function(x){return x.id===b.dataset.id;});if(g){g.done=!g.done;saveCfg();render(true);}},
  'body-save':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var kg=num($('#bw').value),bf=num($('#bf').value);
    if(!(kg>0)&&!(bf>0)){toast('Escribe tu peso o tu % de grasa.');return;}
    var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var e=S.cfg.body.find(function(x){return x.d===ds;});
    if(e){if(kg>0)e.kg=kg;if(bf>0)e.bf=bf;}else S.cfg.body.push({d:ds,kg:kg>0?kg:null,bf:bf>0?bf:null});
    saveCfg();render(true);toast('Medida guardada.');
  },
  'body-del':function(b){if(!canEditCfg())return;S.cfg.body=S.cfg.body.filter(function(x){return x.d!==b.dataset.d;});saveCfg();render(true);},
  export:function(){exportCsv();}
};
(function(){
  var y0=null,x0=null,row=null,pulled=false;
  document.addEventListener('touchstart',function(e){var t=e.touches[0];y0=window.scrollY<=0?t.clientY:null;x0=t.clientX;pulled=false;row=e.target.closest&&e.target.closest('.set');if(row&&e.target.closest('input'))row=null;},{passive:true});
  document.addEventListener('touchmove',function(e){var t=e.touches[0];
    if(row){var dx=t.clientX-x0;if(dx<0&&Math.abs(dx)>Math.abs(t.clientY-(y0==null?t.clientY:y0)))row.style.transform='translateX('+Math.max(dx,-110)+'px)';}
    if(y0!=null&&!row&&t.clientY-y0>90&&(S.tab==='soc'||S.tab==='perfil')&&S.mode==='db'&&!pulled){pulled=true;var q=document.createElement('div');q.className='ptr';q.textContent='Actualizando…';document.body.appendChild(q);setTimeout(function(){q.remove();},1200);if(S.soc&&!S.soc.loading){loadSocial();}}
  },{passive:true});
  document.addEventListener('touchend',function(e){
    if(row){var t=e.changedTouches[0],dx=t.clientX-x0,r=row;row=null;
      if(dx<-90&&S.draft&&r.dataset.i!=null){var it=S.draft.items[+r.dataset.i];if(it&&it.sets.length>1){var j=+r.dataset.j,rm=it.sets.splice(j,1)[0];saveDraft();render(true);toastUndo('Serie quitada',function(){it.sets.splice(j,0,rm);saveDraft();render(true);});return;}}
      r.style.transform='';}
  },{passive:true});
})();
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  unlockAudio();
  var k=b.dataset.confirm;
  if(k){
    if(S.armed!==k){S.armed=k;render(true);clearTimeout(S.armT);S.armT=setTimeout(function(){if(S.armed===k){S.armed=null;render();}},4000);return;}
    S.armed=null;
  }else if(S.armed){S.armed=null;}
  var f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.aqrem!==undefined&&S.aq){S.aq.rem=t.checked;return;}
  if(t.dataset&&t.dataset.he&&S.hdraft){var q=t.dataset.he.split(':');S.hdraft.items[+q[0]].sets[+q[1]][q[2]]=t.value;return;}
  if(t.dataset&&t.dataset.xn!=null&&S.draft){S.draft.items[+t.dataset.xn].sn=t.value;saveDraft();return;}
  if(t.dataset&&t.dataset.f&&S.draft){
    var row=t.closest('.set');if(!row)return;var i=+row.dataset.i,j=+row.dataset.j;
    S.draft.items[i].sets[j][t.dataset.f]=t.value;saveDraft();if(t.dataset.f==='kg')updatePlates(i);return;
  }
  if(t.dataset&&t.dataset.gf&&S.gform){S.gform[t.dataset.gf]=t.value;return;}
  if(t.dataset&&t.dataset.wzt){if(S.wz)S.wz.gearText=t.value;return;}
  if(t.dataset&&t.dataset.onbt){if(S.onb){S.onb.d[t.dataset.onbt]=t.value;onbSave();}return;}
  if(t.id==='q'){S.q=t.value;$('#exlist').innerHTML=exListHTML();return;}
  if(t.id==='sq'){clearTimeout(srchT);var v=t.value;srchT=setTimeout(function(){doSearch(v);},280);return;}
  if(t.id==='pq'){S.pq=t.value;$('#plist').innerHTML=pickerListHTML();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.wzt){if(S.wz)S.wz.gearText=t.value;return;}
  if(t.dataset&&t.dataset.snd){if(canEditCfg()){S.cfg.snd=t.checked;saveCfg();if(t.checked){unlockAudio();beep();}else cancelSnd();}return;}
  if(t.dataset&&t.dataset.sh){if(canEditCfg()){S.cfg.share=t.checked;saveCfg();}return;}
  if(t.id==='pe-file'){var pf=t.files&&t.files[0];t.value='';if(!pf)return;if(PC.indexOf('avatar')<0){toast('Falta activar las fotos de perfil en Supabase (ejecuta supabase/perfil.sql).');return;}
    fitPhoto(pf,function(d){if(!d){toast('No se pudo leer esa imagen.');return;}sb.from('profiles').update({avatar:d}).eq('id',me.id).then(function(r){if(r.error){toast('No se pudo guardar la foto.');return;}prof.avatar=d;render(true);toast('Foto actualizada.');});});return;}
  if(t.id==='impfile'){var f=t.files&&t.files[0];t.value='';if(f)importBackup(f);return;}
  if(t.dataset&&t.dataset.w&&S.draft){S.draft.warm[t.dataset.w]=t.checked;saveDraft();return;}
  if(t.dataset&&t.dataset.gf&&S.gform){
    S.gform[t.dataset.gf]=t.value;
    if(t.dataset.gf==='t'){var o=goalExOptions(t.value);if(!o.some(function(e){return e.id===S.gform.ex;}))S.gform.ex=goalDefEx(t.value);render(true);}
    else if(t.dataset.gf==='stage')render(true);
    return;
  }
  if(t.dataset&&t.dataset.sn){if(canEditCfg()){var ss=routine().find(function(x){return x.key===t.dataset.sn;});if(ss){ss.name=t.value.trim().slice(0,40)||ss.name;saveCfg();}}return;}
  if(t.dataset&&t.dataset.rp){if(canEditCfg()){var kp=t.dataset.rp.split('|'),sr=routine().find(function(x){return x.key===kp[0];});if(sr&&sr.items[+kp[1]]){sr.items[+kp[1]].reps=t.value.trim().slice(0,12);saveCfg();}}return;}
  if(t.dataset&&t.dataset.st){if(canEditCfg()){S.cfg.stageTitles[t.dataset.st]=t.value.trim().slice(0,50);saveCfg();}return;}
  if(t.dataset&&t.dataset.sel==='eq'){S.eq=t.value;$('#exlist').innerHTML=exListHTML();return;}
  if(t.dataset&&t.dataset.sel==='prog'){S.progEx=t.value;render(true);}
});
document.addEventListener('focusout',function(){if(S.dirty)setTimeout(function(){if(S.dirty)render();},80);});

S.cfg=normCfg(ls.get('cf:cfg'));
S.sessions=(ls.get('cf:sessions')||[]).filter(function(x){return x&&x.date;}).sort(byDateDesc);
var dr=ls.get('cf:draft');if(dr&&Array.isArray(dr.items))S.draft=dr;checkStale();restoreRest();
S.mode='init';rebuildEx();renderStatus();render(true);

/* iPhone: al abrir y cerrar el teclado el menú inferior podía quedarse a media pantalla */
(function(){
  var isTxt=function(t){return t&&(t.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|range)$/.test(t.type)||t.tagName==='TEXTAREA');};
  var tm=null;
  function fix(){var x=window.pageXOffset,y=window.pageYOffset;window.scrollTo(x,y+1);window.scrollTo(x,y);}
  document.addEventListener('focusin',function(e){if(isTxt(e.target)){clearTimeout(tm);document.body.classList.add('kb');}});
  document.addEventListener('focusout',function(e){
    if(!isTxt(e.target))return;clearTimeout(tm);
    tm=setTimeout(function(){var a=document.activeElement;if(isTxt(a))return;document.body.classList.remove('kb');fix();setTimeout(fix,250);},120);
  });
  /* red de seguridad: si no hay un campo de texto con foco, el menú siempre se ve */
  function heal(){if(!isTxt(document.activeElement))document.body.classList.remove('kb');}
  document.addEventListener('change',function(){setTimeout(heal,50);});
  document.addEventListener('touchend',function(){setTimeout(heal,300);},{passive:true});
  document.addEventListener('click',function(){setTimeout(heal,300);});
  if(window.visualViewport)window.visualViewport.addEventListener('resize',function(){if(!document.body.classList.contains('kb'))fix();});
})();
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
initP=boot();
})();
