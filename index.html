<head>

<title>Cuaderno de Fuerza</title>

<style>
html{-webkit-text-size-adjust:100%}
body{margin:0;font:14px system-ui,sans-serif}
:root{padding-block:env(safe-area-inset-top,0px) env(safe-area-inset-bottom,0px)}
img{max-width:100%}
[hidden]{display:none!important}

/* cuentas, feed y ranking */
.av{width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex:none}
.fcard{background:var(--surface);border-radius:var(--r-lg);padding:16px;margin-bottom:12px;box-shadow:var(--sh);--sc:var(--blue)}
.fcard.k-piernas{--sc:var(--red)}.fcard.k-push{--sc:var(--blue)}.fcard.k-pull{--sc:var(--green)}
.fh{display:flex;align-items:center;gap:10px}
.fn{display:flex;flex-direction:column;min-width:0}
.fn b{font-size:15px}.fn span{font-size:12.5px;color:var(--muted);overflow-wrap:anywhere;text-transform:capitalize}
.fn span{text-transform:none}
.ft{display:flex;align-items:center;gap:10px;margin:12px 0 6px}
.ft .plate{width:26px;height:26px}
.ft .nm{font-family:var(--font-display);font-size:22px;font-weight:800;text-transform:uppercase;letter-spacing:.02em}
.fs{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted);margin-bottom:8px}
.fs b{font-family:var(--font-num);color:var(--ink);font-size:16px}
.fl{list-style:none;margin:10px 0 0;padding:0;border-top:1px solid var(--line-soft)}
.fl li{display:flex;justify-content:space-between;gap:10px;padding:6px 0;font-size:13.5px;border-bottom:1px solid var(--line-soft)}
.fl li span{min-width:0;overflow-wrap:anywhere}
.fa{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.kb{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-soft);background:var(--raised);border-radius:99px;padding:7px 14px;font-size:13.5px;font-weight:600;color:var(--muted)}
.kb.on{background:var(--sc);border-color:var(--sc);color:var(--on-color)}
.kn{font-size:12.5px;color:var(--muted)}
.cmt{margin-top:12px;border-top:1px solid var(--line-soft);padding-top:10px}
.cm{font-size:14px;padding:4px 0;overflow-wrap:anywhere}
.lnk{border:0;background:none;color:var(--muted);text-decoration:underline;font-size:12px;padding:0 4px}
.cmf{display:flex;gap:8px;margin-top:8px}
.cmf input{flex:1;min-width:0;height:42px;border:1.5px solid transparent;background:var(--raised);border-radius:var(--r-md);padding:0 12px;font-size:15px}
.cmf input:focus{outline:0;border-color:var(--ink)}
.rk,.fr{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line-soft)}
.rk:first-child,.fr:first-child{border-top:0}
.rk.me{font-weight:700}
.rkn{width:20px;text-align:center;color:var(--muted)}
.rkname{flex:1;min-width:0;display:flex;flex-direction:column;overflow-wrap:anywhere}
.rkname small{color:var(--muted);font-weight:500;font-size:12px}
.amsg{font-size:14px;margin:0 0 12px;padding:10px 12px;border-radius:var(--r-sm);background:var(--raised)}
.auth .pchips{margin-bottom:14px}

/* inicio, técnica, asistente, rutinas */
.zones{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.zone{border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-lg);padding:8px 8px 12px;text-align:left;display:flex;flex-direction:column;gap:2px;min-width:0}
.zone:hover{border-color:var(--line)}
.zone .tf{background:var(--raised);border-radius:var(--r-md);height:112px;display:flex;align-items:center;justify-content:center;margin-bottom:6px;overflow:hidden}
.zone .tf svg{height:100%;width:auto;max-width:100%}
.zone b{font-family:var(--font-display);font-size:21px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1.05;padding:0 4px;overflow-wrap:anywhere}.zone small{color:var(--muted);font-size:12px;padding:0 4px}
.h2{margin:22px 0 10px;font-family:'Big Shoulders Display',sans-serif;font-size:22px;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.hero p{margin:4px 0 12px}.hero h3{margin:0}
.tec{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap;margin:10px 0}
.tec svg.fig{width:200px;max-width:100%;height:auto;background:var(--raised);border-radius:var(--r-md);flex:none}
.tec-b{flex:1;min-width:200px}.tec-b ol,.tec2 ul{margin:4px 0 0;padding-left:20px}.tec-b li,.tec2 li{margin:3px 0}
.tec2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;margin-top:6px}
.tec2>div{background:var(--raised);border-radius:var(--r-md);padding:10px 12px}
.tec2 .safe{border-left:4px solid var(--red)}
.fig-cap{font-size:11.5px;color:var(--muted);margin:4px 0 0;width:200px;max-width:100%}
.wz .gl{margin-top:12px}
.rtc h3{margin:0 0 2px}.rtc .by{color:var(--muted);font-size:13px}
.rtc ul{margin:6px 0;padding-left:18px}
.glos dt{font-weight:700;margin-top:8px}.glos dd{margin:2px 0 0;color:var(--muted)}
</style>
<style>
/* Concepto: cuaderno de gimnasio moderno. Superficies blancas redondeadas sobre fondo frío,
   nav flotante de cristal y un color por sesión tomado de los discos olímpicos:
   piernas = rojo (25 kg), push = azul (20 kg), pull = verde (10 kg). */
:root{
  --font-display:'Big Shoulders Display','Barlow Condensed','Arial Narrow',Impact,sans-serif;
  --font-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-num:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --bg:#E8ECEF; --surface:#FFFFFF; --raised:#F0F3F5; --ink:#12181D; --muted:#56616A;
  --line:#D3DADF; --line-soft:#E3E8EB;
  --red:#C23229; --blue:#1B58C4; --green:#237A41; --gold:#A6720A; --on-color:#FFFFFF;
  --sh:0 1px 2px rgba(15,23,32,.05),0 12px 30px -16px rgba(15,23,32,.30);
  --r-lg:22px; --r-md:16px; --r-sm:12px;
  --sc:var(--blue);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1013; --surface:#151A1F; --raised:#1E242A; --ink:#E7ECEF; --muted:#8E9AA3;
    --line:#2B333A; --line-soft:#222930;
    --red:#EE6D63; --blue:#6E9EF4; --green:#5EC282; --gold:#E7B84C; --on-color:#0E1215;
    --sh:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C1013; --surface:#151A1F; --raised:#1E242A; --ink:#E7ECEF; --muted:#8E9AA3;
  --line:#2B333A; --line-soft:#222930;
  --red:#EE6D63; --blue:#6E9EF4; --green:#5EC282; --gold:#E7B84C; --on-color:#0E1215;
  --sh:0 1px 2px rgba(0,0,0,.35),0 14px 30px -16px rgba(0,0,0,.7);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{
  --tint:var(--blue);
  background-color:var(--bg);
  background-image:radial-gradient(120% 100% at 50% 0%,color-mix(in srgb,var(--tint) 16%,transparent),transparent 70%);
  background-repeat:no-repeat;background-size:100% 460px;
  color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.4;
  padding-block:14px 190px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-text-size-adjust:100%;
}
body.t-piernas{--tint:var(--red)} body.t-push{--tint:var(--blue)} body.t-pull{--tint:var(--green)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:720px;margin:0 auto}
.k-piernas{--sc:var(--red)} .k-push{--sc:var(--blue)} .k-pull{--sc:var(--green)}
.stage-1{--sc:var(--blue)} .stage-2{--sc:var(--red)} .stage-3{--sc:var(--green)}

/* cabecera */
.hdr{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:2px 0 16px}
.brand{display:flex;align-items:center;gap:9px;min-width:0;white-space:nowrap;font-family:var(--font-display);font-weight:800;font-size:18px;letter-spacing:.06em;text-transform:uppercase}
.plate{width:24px;height:24px;border-radius:50%;background:var(--sc);flex:none;
  -webkit-mask:radial-gradient(circle at center,transparent 0 27%,#000 28%);mask:radial-gradient(circle at center,transparent 0 27%,#000 28%)}
.outb{font:inherit;font-weight:700;color:var(--red);background:none;border:0;border-left:1px solid var(--line);margin-left:6px;padding:0 0 0 8px;cursor:pointer}
.status{font-size:12px;color:var(--muted);text-align:right;min-width:0;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line-soft);border-radius:99px;padding:4px 10px;white-space:nowrap;flex:none}
.pagehead{margin:4px 0 16px}
.pagehead.flex{display:flex;align-items:center;justify-content:space-between;gap:12px}
.eyebrow{margin:0 0 2px;font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
h1{margin:0;font-family:var(--font-display);font-weight:800;font-size:46px;line-height:.95;letter-spacing:.012em;text-transform:uppercase;text-wrap:balance}
h2{margin:24px 0 10px;font-family:var(--font-display);font-weight:700;font-size:23px;letter-spacing:.04em;text-transform:uppercase}
h3{margin:0;font-size:16.5px;font-weight:700;line-height:1.25}
p{margin:0}
.muted{color:var(--muted)}
.num{font-family:var(--font-num);font-variant-numeric:tabular-nums}
.ring{flex:none}
.ring-t{font-family:var(--font-num);font-size:15px;font-weight:600;fill:var(--ink)}
.toolrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px}
.week-t{font-size:13px;color:var(--muted)}
.week-t b{font-family:var(--font-num);color:var(--ink);font-size:16px}

/* botones */
.btn{border:1px solid var(--line-soft);background:var(--surface);box-shadow:var(--sh);border-radius:var(--r-md);padding:10px 16px;font-weight:600;font-size:14px;min-height:44px;display:inline-flex;align-items:center;justify-content:center;gap:7px}
.btn:hover{border-color:var(--line)}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.sc{background:var(--sc);color:var(--on-color);border-color:var(--sc)}
.btn.sm{min-height:36px;padding:6px 13px;font-size:13px;border-radius:99px;box-shadow:none;border-color:var(--line)}
.btn.sm.primary,.btn.sm.sc{box-shadow:none}
.btn.armed{background:var(--red);color:var(--on-color);border-color:var(--red)}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.ico{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--muted);flex:none}
.ico:hover{background:var(--raised);color:var(--ink)}
.ico.armed{background:var(--red);color:var(--on-color);width:auto;padding:0 12px;border-radius:99px;font-size:13px;font-weight:600}
.ic{display:block}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

/* tarjetas */
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:16px;box-shadow:var(--sh)}
.card+.card{margin-top:12px}

/* selector de sesión */
.chips{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin:0 0 14px}
.chip{border:0;background:color-mix(in srgb,var(--sc) 13%,var(--surface));border-radius:20px;padding:12px 12px 10px;text-align:left;display:flex;flex-direction:column;gap:12px;min-width:0;min-height:96px;box-shadow:var(--sh)}
.chip .plate{width:30px;height:30px}
.chip .tk{color:var(--sc)}
.chip .nm{font-family:var(--font-display);font-weight:800;font-size:20px;line-height:1.02;letter-spacing:.03em;text-transform:uppercase;overflow-wrap:anywhere;hyphens:auto}
.chip .sub{font-size:11.5px;color:var(--muted);min-height:15px;font-weight:600}
.chip .top{display:flex;align-items:center;justify-content:space-between}
.chip.on{background:var(--sc);color:var(--on-color)}
.chip.on .plate{background:var(--on-color)}
.chip.on .tk,.chip.on .sub{color:var(--on-color)}
.chip.on .sub{opacity:.85}

/* entrenamiento */
.meta{font-size:13px;color:var(--muted)}
.meta-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:3px}
.rchip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--raised);border-radius:99px;padding:3px 11px 3px 8px;font-size:12.5px;font-weight:600;font-family:var(--font-num)}
.rchip:hover{border-color:var(--ink)}
.wh{background:linear-gradient(140deg,var(--sc),color-mix(in srgb,var(--sc) 76%,var(--ink)));color:var(--on-color);border-radius:var(--r-lg);padding:16px 16px 14px;margin-bottom:12px;box-shadow:var(--sh)}
.wh-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.wh-k{font-size:11.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:700;opacity:.8}
.wh-n{font-family:var(--font-display);font-weight:800;font-size:38px;line-height:1;text-transform:uppercase;letter-spacing:.02em;margin-top:2px}
.wh-c{display:flex;align-items:center;gap:6px;background:color-mix(in srgb,var(--on-color) 20%,transparent);border-radius:99px;padding:5px 11px;font-size:14px;font-weight:600}
.wh-f{font-size:13px;opacity:.88;margin:8px 0 12px}
.wh-p{display:flex;align-items:center;gap:12px}
.wh-bar{flex:1;height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-color) 28%,transparent);overflow:hidden}
.wh-bar i{display:block;height:100%;background:var(--on-color);border-radius:99px;transition:width .3s}
.warm{margin-bottom:12px}
.warm h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-size:19px;margin-bottom:6px}
.chk{display:flex;gap:12px;align-items:flex-start;padding:8px 0;font-size:14px}
.chk input{width:22px;height:22px;margin:0;accent-color:var(--sc);flex:none}
.ex{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r-lg);padding:14px 12px 12px;margin-bottom:12px;box-shadow:var(--sh)}
.ex-h{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;margin-bottom:10px;padding:0 2px}
.ex-h .nm{min-width:0}
.note{font-size:13px;background:var(--raised);border-radius:var(--r-sm);padding:8px 11px;margin:0 0 10px;color:var(--muted)}
.sh,.set{display:grid;grid-template-columns:36px minmax(0,1fr) minmax(0,1fr) 54px;gap:8px;align-items:center}
.sh{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600;padding:0 0 4px;text-align:center}
.set{padding:5px 4px;border-radius:var(--r-md);margin:0 -4px}
.set.done{background:color-mix(in srgb,var(--sc) 13%,var(--surface))}
.sn{height:54px;border:0;background:transparent;border-radius:var(--r-sm);font-family:var(--font-num);font-weight:600;font-size:15px;color:var(--muted)}
.set.warm .sn{border:1.5px dashed var(--muted);color:var(--ink);font-family:var(--font-display);font-size:18px;font-weight:800}
.in{width:100%;height:56px;border:1.5px solid transparent;background:var(--raised);border-radius:16px;text-align:center;font-family:var(--font-num);font-size:21px;font-weight:500;padding:0 4px;min-width:0}
.in::placeholder{color:var(--muted);opacity:.55}
.in:focus{outline:0;border-color:var(--sc);background:var(--surface)}
.ck{width:50px;height:50px;justify-self:center;border:1.5px solid var(--line);background:var(--surface);border-radius:50%;display:flex;align-items:center;justify-content:center;color:transparent}
.ck:hover{border-color:var(--muted)}
.set.done .ck{background:var(--sc);border-color:var(--sc);color:var(--on-color)}
.ex-f{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.plates{font-size:12.5px;color:var(--muted);margin-left:auto;text-align:right}
.plates b{font-family:var(--font-num);color:var(--ink);font-weight:500}
.sum{border:1.5px solid var(--ink);margin-bottom:14px}
.sum h3{font-family:var(--font-display);text-transform:uppercase;letter-spacing:.05em;font-size:23px}
.sum-g{display:flex;flex-wrap:wrap;gap:6px 18px;margin:8px 0}
.sum-g span{font-size:13px;color:var(--muted)}
.sum-g b{font-family:var(--font-num);font-size:16px;color:var(--ink);font-weight:600}
.pr{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--gold);margin-right:12px}
.alert{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;background:var(--surface);border:1.5px solid var(--ink);border-radius:var(--r-md);padding:12px 14px;margin-bottom:12px;font-size:14px}
.alert div{display:flex;gap:8px;flex-wrap:wrap}

/* descanso */
.rest{position:fixed;left:0;right:0;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:30;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.rest-in{max-width:520px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:22px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:8px;box-shadow:0 16px 36px -14px rgba(0,0,0,.55)}
.rest-n{font-family:var(--font-num);font-size:25px;font-weight:600;font-variant-numeric:tabular-nums;display:block;line-height:1.1}
.rest-l{font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;opacity:.7;display:block;line-height:1;white-space:nowrap}
.rest-t{flex:none;min-width:84px}
.rest-p{flex:1;height:6px;border-radius:99px;background:color-mix(in srgb,var(--bg) 25%,transparent);overflow:hidden;min-width:16px}
.rest-p i{display:block;height:100%;width:0;background:var(--bg);border-radius:99px}
.rest .btn{background:transparent;color:var(--bg);border-color:color-mix(in srgb,var(--bg) 30%,transparent);min-height:38px;padding:6px 12px}
.rest .btn.ib{padding:6px 9px}

/* navegación flotante */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-right,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.nav-in{pointer-events:auto;max-width:520px;margin:0 auto;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:1px;padding:6px 4px;border-radius:26px;
  background:color-mix(in srgb,var(--surface) 84%,transparent);-webkit-backdrop-filter:blur(18px) saturate(1.5);backdrop-filter:blur(18px) saturate(1.5);
  border:1px solid var(--line);box-shadow:0 18px 40px -16px rgba(0,0,0,.45)}
.tab{border:0;background:transparent;border-radius:20px;padding:7px 1px 6px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10.5px;font-weight:600;color:var(--muted);min-width:0}
.tab span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab[aria-current="page"]{color:var(--bg);background:var(--ink)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(150px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;font-weight:500;max-width:calc(100% - 32px);text-align:center;box-shadow:0 12px 28px -12px rgba(0,0,0,.5)}

/* plan */
.rules summary{cursor:pointer;font-weight:700;font-size:15px}
.rules ul{margin:10px 0 0;padding-left:18px;font-size:14px;color:var(--muted)}
.rules li{margin:3px 0}
.s-h{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.s-h .plate{width:30px;height:30px}
.s-h .nm{font-family:var(--font-display);font-weight:800;font-size:28px;letter-spacing:.03em;text-transform:uppercase;line-height:1}
.s-h .go{margin-left:auto}

function baseSets(id){

  DEFAULT.forEach(function(r){r.items.forEach(function(it){if(it.id===id&&it.last){if(!best||epley(it.last.kg,it.last.reps)>epley(best.kg,best.reps)||(best.kg===0&&it.last.kg>0))best=it.last;}});});

}
function histFor(id){

    var it=(s.items||[]).find(function(x){return x.id===id;});

  });

}

function entryVal(ex,h){

function lastSessionSets(id){

async function saveFile(name,data,mime){

  try{var u=URL.createObjectURL(new Blob([data],{type:mime||'text/plain'})),a=document.createElement('a');a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},2000);return true;}
  catch(e){toast('No se pudo exportar.');return false;}
}

async function importBackup(file){
  if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
  try{
    var j=JSON.parse(await file.text());
    if(!j||j.app!=='cuaderno-de-fuerza'||!Array.isArray(j.sessions))throw new Error('formato');
    S.cfg=normCfg(j.cfg);rebuildEx();await saveCfg();
    var list=j.sessions.filter(function(s){return s&&s.id&&s.date&&Array.isArray(s.items);});
    for(var i=0;i<list.length;i++){var s=list[i];if(S.mode==='db'){s.shared=S.cfg.share!==false;var r=await sb.from('sessions').upsert(sessRow(s));if(r.error)throw r.error;}}
    S.sessions=list.concat(S.sessions.filter(function(x){return !list.some(function(y){return y.id===x.id;});})).sort(byDateDesc);
    mirror();render(true);toast('Copia importada: '+list.length+' sesiones.');
  }catch(e){toast('No se pudo importar ese archivo.');}
}

var toastT=null;

function unlockAudio(){try{var AC=window.AudioContext||window.webkitAudioContext;if(AC&&!actx)actx=new AC();if(actx&&actx.state==='suspended')actx.resume();}catch(e){}}
function beep(){
  try{
    if(!actx)return;var o=actx.createOscillator(),g=actx.createGain(),t=actx.currentTime;
    o.type='sine';o.frequency.value=880;g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(0.25,t+0.03);g.gain.exponentialRampToValueAtTime(0.0001,t+0.6);
    o.connect(g);g.connect(actx.destination);o.start(t);o.stop(t+0.65);
  }catch(e){}
  try{if(navigator.vibrate)navigator.vibrate([180,80,180]);}catch(e){}
}
function startRestSec(sec,label,exId){
  rest={end:Date.now()+sec*1000,total:sec,done:false,label:label,exId:exId||null};
  $('#rest').hidden=false;$('#rest').classList.remove('end');tick();
}
function startRest(it){var ex=exOf(it.id);startRestSec(restFor(ex),ex.name,ex.id);}
function stopRest(){rest=null;$('#rest').hidden=true;}
function tick(){
  if(rest){
    var left=Math.ceil((rest.end-Date.now())/1000);
    if(left<=0){
      if(!rest.done){rest.done=true;rest.hideAt=Date.now()+7000;beep();}
      $('#restL').textContent='Descanso terminado';$('#restN').textContent='0:00';$('#restP').style.width='100%';$('#rest').classList.add('end');
      if(Date.now()>rest.hideAt)stopRest();
    }else{
      $('#restL').textContent=rest.label==='Temporizador'?'Temporizador':'Descanso';$('#restN').textContent=clock(left);
      $('#restP').style.width=Math.min(100,Math.round((1-left/rest.total)*100))+'%';
    }
  }
  var el=$('#elapsed');if(el&&S.draft&&S.draft.startedAt)el.textContent=clock((Date.now()-S.draft.startedAt)/1000);
}

function platesFor(kg){
  var r=(kg-20)/2;if(!(r>0))return null;
  var P=[25,20,15,10,5,2.5,1.25],out=[];
  P.forEach(function(p){while(r>=p-1e-9){out.push(p);r-=p;}});
  return {out:out,rest:Math.round(r*100)/100};
}
function platesHTML(it,d){
  if(!PLATE_IDS[it.id])return '';
  var first=null;
  for(var j=0;j<it.sets.length;j++){if(!it.sets[j].w){first=j;break;}}
  if(first==null)return '';
  var kg=num(it.sets[first].kg);if(kg==null)kg=num(phFor(it,first).kg);
  var p=kg?platesFor(kg):null;
  if(!p||!p.out.length)return '<span class="plates">Barra de 20 kg</span>';
  return '<span class="plates">Por lado (barra 20 kg): <b>'+p.out.map(fmt).join(' + ')+'</b>'+(p.rest>0.01?' (faltan '+fmt(p.rest)+' kg)':'')+'</span>';
}

  });
  var nm=OBJ[g.obj]+' · '+g.days+' días',k=2,full=nm;

function niceStep(x){if(!(x>0))return 1;var p=Math.pow(10,Math.floor(Math.log(x)/Math.LN10)),f=x/p;return (f<1.5?1:f<3?2:f<7?5:10)*p;}
function chartSVG(pts){
  var W=640,H=240,L=50,R=26,T=22,B=32,n=pts.length;
  var min=Math.min.apply(null,pts.map(function(p){return p.v;})),max=Math.max.apply(null,pts.map(function(p){return p.v;}));
  if(min===max){min=Math.max(0,min-5);max=max+5;}
  var step=niceStep((max-min)/4),y0=Math.floor(min/step)*step,y1=Math.ceil(max/step)*step;if(y0===y1)y1=y0+step;
  var X=function(i){return n===1?(L+(W-L-R)/2):L+i*(W-L-R)/(n-1);},Y=function(v){return T+(H-T-B)*(1-(v-y0)/(y1-y0));};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Evolución del ejercicio">';
  for(var v=y0;v<=y1+1e-9;v+=step){s+='<line class="gl" x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(v).toFixed(1)+'" y2="'+Y(v).toFixed(1)+'"/><text class="tx" x="'+(L-8)+'" y="'+(Y(v)+4).toFixed(1)+'" text-anchor="end">'+fmt(v)+'</text>';}
  if(n>1)s+='<path class="ln" d="'+pts.map(function(p,i){return (i?'L':'M')+X(i).toFixed(1)+' '+Y(p.v).toFixed(1);}).join(' ')+'"/>';
  pts.forEach(function(p,i){
    var last=i===n-1,cx=X(i).toFixed(1),cy=Y(p.v).toFixed(1);
    s+='<circle class="'+(last?'pe':'pt')+'" cx="'+cx+'" cy="'+cy+'" r="'+(last?6:4)+'"/>';
    if(last)s+='<text class="vl" x="'+cx+'" y="'+(Y(p.v)-12).toFixed(1)+'" text-anchor="'+(n>1?'end':'middle')+'">'+fmt(p.v)+'</text>';
  });
  var idx=n===1?[0]:n===2?[0,1]:[0,Math.floor((n-1)/2),n-1];
  idx.forEach(function(i){s+='<text class="tx" x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="'+(n===1?'middle':i===0?'start':i===n-1?'end':'middle')+'">'+esc(dateShort(pts[i].d))+'</text>';});
  return s+'</svg>';
}
function progIds(){

}

function goalExOptions(t){

function goalDefEx(t){var o=goalExOptions(t),pref=(t==='e1rm'||t==='e1rmbw')?'press-banca-barra':(t==='repsLoaded'?'fondos-pecho':'dominadas');return (o.find(function(e){return e.id===pref;})||o[0]||{}).id||'';}
function goalVal(g){
  var m=g.m,best=0;
  if(m.t==='e1rm'){m.ex.forEach(function(id){best=Math.max(best,bestE1(id));});return best?{txt:'1RM estimado '+fmt(best)+' kg de '+fmt(m.target)+' kg',pct:best/m.target}:{txt:'Sin datos todavía',pct:0};}
  if(m.t==='maxReps'){var ids=m.ex||['dominadas'],r=0;S.sessions.forEach(function(s){(s.items||[]).forEach(function(it){if(ids.indexOf(it.id)>=0)(it.sets||[]).forEach(function(x){if(!x.w&&!(x.kg>0))r=Math.max(r,x.reps||0);});});});return r?{txt:'Mejor serie a peso corporal: '+r+' de '+m.target+' reps',pct:r/m.target}:{txt:'Registra '+esc(exOf(ids[0]).name.toLowerCase())+' con 0 kg extra para medir esta meta',pct:0};}
  if(m.t==='repsLoaded'){var br=0,bk=0;m.ex.forEach(function(id){histFor(id).forEach(function(h){h.sets.forEach(function(s){if(s.kg>0&&s.reps>br){br=s.reps;bk=s.kg;}});});});return br?{txt:'Mejor serie con lastre: +'+fmt(bk)+' kg × '+br+' (meta: '+m.target+' reps)',pct:br/m.target}:{txt:'Sin series con lastre registradas',pct:0};}
  if(m.t==='e1rmbw'){var bw=bodyLatest().kg;if(!bw)return {txt:'Añade tu peso corporal más abajo para calcular esta meta',pct:0};m.ex.forEach(function(id){best=Math.max(best,bestE1(id));});var tg=bw*m.mult;return best?{txt:'1RM estimado '+fmt(best)+' kg · meta '+fmt(tg)+' kg ('+fmt(m.mult)+'× tu peso)',pct:best/tg}:{txt:'Sin datos todavía · meta '+fmt(tg)+' kg',pct:0};}
  if(m.t==='bf'){var bf=bodyLatest().bf;return bf?{txt:'Última medida: '+fmt(bf)+' % · objetivo '+m.lo+'–'+m.hi+' %',pct:null,done:bf<=m.hi}:{txt:'Añade tu % de grasa más abajo · objetivo '+m.lo+'–'+m.hi+' %',pct:null};}
  return {txt:'',pct:null};
}

function renderTimer(){

  $('#picker').innerHTML='<div class="sheet-bg" data-act="pk-close"></div><div class="sheet tm" role="dialog" aria-label="Temporizador de descanso"><div class="sheet-in"><div class="grab"></div>'

    +(ex?'<p class="meta">Descanso para '+esc(ex.name)+(ov?' (personalizado)':'')+'</p>':'<p class="meta">Descanso libre</p>')
    +'<div class="tdisp num" aria-live="polite">'+clock(t.sec)+'</div>'
    +'<div class="tadj">'+[-15,-5,5,15].map(function(d){return '<button class="btn" data-act="timer-adj" data-d="'+d+'">'+(d>0?'+':'−')+Math.abs(d)+' s</button>';}).join('')+'</div>'
    +'<div class="tpre">'+pre.map(function(p){return '<button class="gc'+(p===t.sec?' on':'')+'" data-act="timer-set" data-s="'+p+'">'+clock(p)+'</button>';}).join('')+'</div>'
    +'<button class="btn sc block" data-act="timer-start">'+ic(I.timer,18)+'Iniciar '+clock(t.sec)+'</button>'

function startDraft(k){S.draft=makeDraft(k);S.pendingSwitch=null;S.summary=null;stopRest();saveDraft();render(true);}
async function finish(){
  var d=S.draft;if(!d)return;
  var items=[],nsets=0,vol=0,prs=[];
  d.items.forEach(function(it){
    var sets=it.sets.filter(function(s){return s.done;}).map(function(s){return {kg:num(s.kg)||0,reps:Math.round(num(s.reps)||0),w:!!s.w};}).filter(function(s){return s.reps>0;});
    if(!sets.length)return;
    items.push({id:it.id,sets:sets});
    sets.forEach(function(s){if(!s.w){nsets++;vol+=s.kg*s.reps;}});
    var ex=exOf(it.id),work=sets.filter(function(s){return !s.w;});
    if(isBW(ex)){var pk=0;histFor(it.id).forEach(function(h){h.sets.forEach(function(s){pk=Math.max(pk,s.kg||0);});});var ck=Math.max.apply(null,work.map(function(s){return s.kg;}).concat([0]));if(pk>0&&ck>pk)prs.push(ex.name);}
    else{var prev=bestE1(it.id),cur=Math.max.apply(null,work.map(function(s){return epley(s.kg,s.reps);}).concat([0]));if(prev>0&&cur>prev+0.01)prs.push(ex.name);}
  });
  if(!items.length){toast('Marca al menos una serie como hecha.');return;}
  await initP;
  var now=new Date(),dur=d.startedAt?Math.max(1,Math.round((Date.now()-d.startedAt)/60000)):null;
  var s={id:'s'+now.toISOString().replace(/\D/g,''),date:now.toISOString(),key:d.key,name:d.name,kind:d.kind,dur:dur,items:items,nsets:nsets,vol:Math.round(vol),prs:prs};
  try{await saveSession(s);}catch(e){toast('No se pudo guardar la sesión. Se conserva tu borrador.');return;}
  S.draft=null;saveDraft();stopRest();S.summary={name:d.name,nsets:nsets,vol:vol,dur:dur,prs:prs};
  render(true);window.scrollTo(0,0);
}
async function exportCsv(){
  if(!S.sessions.length){toast('Aún no hay sesiones que exportar.');return;}
  var rows=[['Fecha','Sesión','Ejercicio','Serie','Tipo','Kg','Reps']];
  S.sessions.slice().reverse().forEach(function(s){(s.items||[]).forEach(function(it){var n=0;(it.sets||[]).forEach(function(x){if(!x.w)n++;rows.push([s.date.slice(0,10),s.name,exOf(it.id).name,x.w?'A':n,x.w?'Aproximación':'Trabajo',String(x.kg).replace('.',','),x.reps]);});});});
  var csv=rows.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(';');}).join('\r\n');
  if(await saveFile('cuaderno-de-fuerza.csv','﻿'+csv,'text/csv;charset=utf-8'))toast('Archivo listo.');
}

  'sess-new':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var rt=routine(),n=rt.length+1;
    rt.push({key:'s'+Date.now().toString(36),name:'Sesión '+n,kind:'push',focus:'',items:[]});
    S.tab='plan';S.edit=true;saveCfg();render(true);window.scrollTo(0,0);toast('Sesión creada. Añade ejercicios desde Inicio → Ejercicios por zona.');
  },
  'wz-cancel':function(){S.wz=null;render(true);},
  'wz-set':function(b){var k=b.dataset.k,v=b.dataset.v;S.wz[k]=(k==='days'||k==='mins')?parseInt(v,10):v;render(true);},
  'wz-tog':function(b){S.wz[b.dataset.k]=!S.wz[b.dataset.k];render(true);},
  'wz-make':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var r=CF_ASIS.build(S.wz,{exOf:exOf,has:function(id){return EX.has(id);}});
    dropBlank();S.cfg.plans.push(r.plan);S.cfg.activePlan=r.plan.id;S.whyOpen=r.plan.id;S.wz=null;S.edit=false;S.tab='plan';
    saveCfg();render(true);window.scrollTo(0,0);toast('Rutina creada y activada.');
  },
  'rt-open':function(b){S.openRt=S.openRt===b.dataset.id?null:b.dataset.id;render(true);},
  'rt-share':async function(){
    if(S.mode!=='db'||!S.cfgReady){toast('Inicia sesión para compartir.');return;}
    var pl=activePlan(),ids={};
    var sess=pl.sessions.map(function(s){return {name:s.name,kind:s.kind,focus:s.focus||'',items:s.items.map(function(it){ids[it.id]=1;return {id:it.id,sets:it.sets,reps:it.reps||'',note:it.note||''};})};});
    var custom=(S.cfg.custom||[]).filter(function(e){return ids[e.id];}).map(function(e){return {id:e.id,name:e.name,grp:e.grp,eq:e.eq,t:e.t};});
    var ex=S.soc.routines.find(function(r){return r.owner===me.id&&r.data&&r.data.pid===pl.id;});
    var row={owner:me.id,name:String(pl.name).slice(0,80),note:String(pl.note||'').slice(0,500),data:{pid:pl.id,sessions:sess,custom:custom}};
    var r=ex?await sb.from('shared_routines').update(row).eq('id',ex.id).select('id,owner,name,note,data,created_at').single():await sb.from('shared_routines').insert(row).select('id,owner,name,note,data,created_at').single();
    if(r.error){toast('No se pudo compartir la rutina.');return;}
    var i=S.soc.routines.findIndex(function(x){return x.id===r.data.id;});
    if(i>=0)S.soc.routines[i]=r.data;else S.soc.routines.unshift(r.data);
    S.soc.rtOk=true;S.soc.sub='rt';S.tab='soc';render(true);window.scrollTo(0,0);toast('Rutina compartida con tus amigos.');
  },
  'rt-unshare':async function(b){
    var id=b.dataset.id,r=await sb.from('shared_routines').delete().eq('id',id);
    if(r.error){toast('No se pudo dejar de compartir.');return;}
    S.soc.routines=S.soc.routines.filter(function(x){return x.id!==id;});render(true);toast('Ya no se comparte.');
  },
  'rt-like':async function(b){
    var id=b.dataset.id,arr=S.soc.rlikes[id]=S.soc.rlikes[id]||[],i=arr.indexOf(me.id);
    if(i>=0){arr.splice(i,1);render(true);var r=await sb.from('routine_likes').delete().eq('routine_id',id).eq('user_id',me.id);if(r.error){arr.push(me.id);render(true);toast('No se pudo quitar el me gusta.');}}
    else{arr.push(me.id);render(true);var r2=await sb.from('routine_likes').insert({routine_id:id,user_id:me.id});if(r2.error){arr.splice(arr.indexOf(me.id),1);render(true);toast('No se pudo dar me gusta.');}}
  },
  'rt-copy':function(b){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var r=S.soc.routines.find(function(x){return x.id===b.dataset.id;});if(!r)return;
    var d=r.data||{},pid='c'+Date.now().toString(36);
    (d.custom||[]).forEach(function(e){if(e&&e.id&&e.name&&!EX.has(e.id)){S.cfg.custom.push({id:String(e.id).slice(0,40),name:String(e.name).slice(0,80),grp:GROUPS.indexOf(e.grp)>=0?e.grp:'Otros',eq:EQS.indexOf(e.eq)>=0?e.eq:'Peso corporal',t:e.t==='C'?'C':'A',sec:'',cue:'',alias:'',custom:true});}});
    rebuildEx();
    var sess=(d.sessions||[]).map(function(s,i){return {key:pid+'-'+(i+1),name:String(s.name||'Sesión').slice(0,60),kind:['push','pull','piernas'].indexOf(s.kind)>=0?s.kind:'push',focus:String(s.focus||'').slice(0,120),items:(s.items||[]).filter(function(it){return it&&EX.has(it.id);}).map(function(it){return {id:it.id,sets:Math.max(1,Math.min(10,parseInt(it.sets,10)||3)),reps:String(it.reps||'').slice(0,12),last:null,note:String(it.note||'').slice(0,200)};})};}).filter(function(s){return s.items.length;});
    if(!sess.length){toast('Esta rutina no se puede copiar.');return;}
    var nm=(r.name+' (de '+pName(r.owner)+')').slice(0,80);
    dropBlank();S.cfg.plans.push({id:pid,name:nm,note:'Rutina de '+pName(r.owner)+'. '+String(r.note||'').slice(0,300),sessions:sess,created:new Date().toISOString()});
    S.cfg.activePlan=pid;S.edit=false;S.tab='plan';saveCfg();render(true);window.scrollTo(0,0);toast('Copiada a tus planes y activada.');
  },
  'g-to-plan':function(){S.tab='plan';S.gen=defaultGen();render(true);window.scrollTo(0,0);},
  'g-new':function(){S.gform={id:null,stage:String(goalStages()[0]||1),t:'e1rm',ex:goalDefEx('e1rm'),target:'',mult:'',lo:'',hi:'',label:'',newTitle:''};render(true);window.scrollTo(0,0);},
  'g-edit-mode':function(){S.goalEdit=!S.goalEdit;render(true);},
  'g-cancel':function(){S.gform=null;render(true);},
  'g-edit':function(b){
    var g=S.cfg.goalList.find(function(x){return x.id===b.dataset.id;});if(!g)return;
    var m=g.m||{};
    S.gform={id:g.id,stage:String(g.stage),t:g.manual?'manual':m.t,ex:(m.ex&&m.ex[0])||'',target:m.target||'',mult:m.mult||'',lo:m.lo||'',hi:m.hi||'',label:g.label,newTitle:''};
    render(true);window.scrollTo(0,0);
  },
  'g-del':function(b){if(!canEditCfg())return;S.cfg.goalList=S.cfg.goalList.filter(function(g){return g.id!==b.dataset.id;});saveCfg();render(true);},
  'g-save':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var f=S.gform;if(!f)return;
    var t=f.t,label=(f.label||'').trim(),m=null,manual=false,ex=f.ex?exOf(f.ex):null;
    var tg=num(f.target),mu=num(f.mult),lo=num(f.lo),hi=num(f.hi);
    if(t==='e1rm'){if(!(tg>0)||!ex){toast('Elige ejercicio y kilos objetivo.');return;}m={t:t,ex:[f.ex],target:tg};if(!label)label=ex.name+' '+fmt(tg)+' kg';}
    else if(t==='e1rmbw'){if(!(mu>0)||!ex){toast('Elige ejercicio y múltiplo.');return;}m={t:t,ex:[f.ex],mult:mu};if(!label)label=ex.name+' '+fmt(mu)+'× tu peso corporal';}
    else if(t==='maxReps'){if(!(tg>0)||!ex){toast('Elige ejercicio y repeticiones.');return;}m={t:t,ex:[f.ex],target:Math.round(tg)};if(!label)label=Math.round(tg)+' repeticiones de '+ex.name.toLowerCase();}
    else if(t==='repsLoaded'){if(!(tg>0)||!ex){toast('Elige ejercicio y repeticiones.');return;}m={t:t,ex:[f.ex],target:Math.round(tg)};if(!label)label=ex.name+' con lastre × '+Math.round(tg);}
    else if(t==='bf'){if(!(lo>0)||!(hi>=lo)){toast('Indica el rango de grasa, por ejemplo 10 y 15.');return;}m={t:t,lo:lo,hi:hi};if(!label)label='Llegar a '+fmt(lo)+'–'+fmt(hi)+' % de grasa corporal';}
    else{if(!label){toast('Escribe el nombre del hito.');return;}manual=true;}
    var stage;
    if(f.stage==='new'){stage=Math.max.apply(null,goalStages().concat([0]))+1;if((f.newTitle||'').trim())S.cfg.stageTitles[stage]=f.newTitle.trim().slice(0,50);}
    else stage=+f.stage;
    var old=f.id?S.cfg.goalList.find(function(x){return x.id===f.id;}):null;
    var goal={id:old?old.id:'g-'+Date.now().toString(36),stage:stage,label:label};
    if(manual){goal.manual=true;goal.done=old&&old.manual?!!old.done:false;}else goal.m=m;
    if(old)S.cfg.goalList[S.cfg.goalList.indexOf(old)]=goal;else S.cfg.goalList.push(goal);
    S.gform=null;saveCfg();render(true);toast('Meta guardada.');
  },
  'g-toggle':function(b){if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}var g=S.cfg.goalList.find(function(x){return x.id===b.dataset.id;});if(g){g.done=!g.done;saveCfg();render(true);}},
  'body-save':function(){
    if(!canEditCfg()){toast('Espera un momento: se están cargando tus datos.');return;}
    var kg=num($('#bw').value),bf=num($('#bf').value);
    if(!(kg>0)&&!(bf>0)){toast('Escribe tu peso o tu % de grasa.');return;}
    var d=new Date(),ds=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
    var e=S.cfg.body.find(function(x){return x.d===ds;});
    if(e){if(kg>0)e.kg=kg;if(bf>0)e.bf=bf;}else S.cfg.body.push({d:ds,kg:kg>0?kg:null,bf:bf>0?bf:null});
    saveCfg();render(true);toast('Medida guardada.');
  },
  'body-del':function(b){if(!canEditCfg())return;S.cfg.body=S.cfg.body.filter(function(x){return x.d!==b.dataset.d;});saveCfg();render(true);},
  export:function(){exportCsv();}
};
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  unlockAudio();
  var k=b.dataset.confirm;
  if(k){
    if(S.armed!==k){S.armed=k;render(true);clearTimeout(S.armT);S.armT=setTimeout(function(){if(S.armed===k){S.armed=null;render();}},4000);return;}
    S.armed=null;
  }else if(S.armed){S.armed=null;}
  var f=ACT[b.dataset.act];if(f)f(b,e);
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.f&&S.draft){
    var row=t.closest('.set');if(!row)return;var i=+row.dataset.i,j=+row.dataset.j;
    S.draft.items[i].sets[j][t.dataset.f]=t.value;saveDraft();if(t.dataset.f==='kg')updatePlates(i);return;
  }
  if(t.dataset&&t.dataset.gf&&S.gform){S.gform[t.dataset.gf]=t.value;return;}
  if(t.id==='q'){S.q=t.value;$('#exlist').innerHTML=exListHTML();return;}
  if(t.id==='pq'){S.pq=t.value;$('#plist').innerHTML=pickerListHTML();return;}
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.dataset&&t.dataset.sh){if(canEditCfg()){S.cfg.share=t.checked;saveCfg();}return;}
  if(t.id==='impfile'){var f=t.files&&t.files[0];t.value='';if(f)importBackup(f);return;}
  if(t.dataset&&t.dataset.w&&S.draft){S.draft.warm[t.dataset.w]=t.checked;saveDraft();return;}
  if(t.dataset&&t.dataset.gf&&S.gform){
    S.gform[t.dataset.gf]=t.value;
    if(t.dataset.gf==='t'){var o=goalExOptions(t.value);if(!o.some(function(e){return e.id===S.gform.ex;}))S.gform.ex=goalDefEx(t.value);render(true);}
    else if(t.dataset.gf==='stage')render(true);
    return;
  }
  if(t.dataset&&t.dataset.st){if(canEditCfg()){S.cfg.stageTitles[t.dataset.st]=t.value.trim().slice(0,50);saveCfg();}return;}
  if(t.dataset&&t.dataset.sel==='eq'){S.eq=t.value;$('#exlist').innerHTML=exListHTML();return;}
  if(t.dataset&&t.dataset.sel==='prog'){S.progEx=t.value;render(true);}
});
document.addEventListener('focusout',function(){if(S.dirty)setTimeout(function(){if(S.dirty)render();},80);});

/* ---------- arranque ---------- */
S.cfg=normCfg(ls.get('cf:cfg'));
S.sessions=(ls.get('cf:sessions')||[]).filter(function(x){return x&&x.date;}).sort(byDateDesc);
var dr=ls.get('cf:draft');if(dr&&Array.isArray(dr.items))S.draft=dr;
S.mode='init';rebuildEx();renderStatus();render(true);
if('serviceWorker' in navigator&&location.protocol==='https:'){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
initP=boot();
})();
</script>
